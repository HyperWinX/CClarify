name: CClarify CI

on:
  push:
  pull_request:
    branches: [master]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        std: [99, 11, 17, 23]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Install conan
        uses: conan-io/setup-conan@v1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: build
        run: conan build . -o std=${{ matrix.std }}
